name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout at tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node 26
        uses: actions/setup-node@v6
        with:
          node-version: '26'

      - name: Derive version + assert package.json matches
        id: ver
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then
            echo "ERROR: tag '$TAG' does not start with v"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Tag is prerelease iff it carries a hyphen segment (e.g. v1.0.6-rc.1).
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          # The root package.json holds the version, the one source.
          PKG_VER="$(node -p "require('./package.json').version")"
          if [[ "$PKG_VER" != "$VERSION" ]]; then
            echo "ERROR: package.json version ($PKG_VER) does not match tag ($VERSION)."
            exit 1
          fi
          echo "package.json version matches $VERSION"

      # The root's dev tools (ESLint), the frontend's packages (its unit tests and the
      # build) and the backend's (its unit tests build the app). The tarball carries
      # none of them: a host installs the backend's itself.
      - name: Install dependencies
        run: |
          npm ci
          (cd frontend && npm ci)
          (cd backend && npm ci)

      # The shell check needs shellcheck, at the version development runs: the
      # runner's own (0.9.0 from apt) reports checks 0.11.0 turned off by
      # default, and lacks those it added. The pinned checksum refuses any other
      # file.
      - name: Install shellcheck 0.11.0
        run: |
          set -euo pipefail
          SC_TARBALL="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSL --connect-timeout 10 --max-time 120 -o "$SC_TARBALL" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $SC_TARBALL" | sha256sum -c -
          tar -xJf "$SC_TARBALL" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      # The gate: nothing is built, staged or published unless every check passes.
      - name: Check
        timeout-minutes: 10
        run: npm run check

      # The release-shaped tree and its tarball, by the same script push.sh uses:
      # it builds the frontend, stages the file list and refuses a tree or tarball
      # holding test files, extended attributes or macOS litter.
      - name: Stage release tarball
        id: pack
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          scripts/stage-release.sh dist
          ARCHIVE="wisp-$VERSION.tar.gz"
          mv "dist/$ARCHIVE" "$ARCHIVE"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "sha256=$ARCHIVE.sha256" >> "$GITHUB_OUTPUT"
          ls -lh "$ARCHIVE" "$ARCHIVE.sha256"

      - name: Extract release notes from CHANGELOG
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          # Pull lines between the "## YYYY-MM-DD (<tag>)" heading for this
          # version and the next "## " heading. Falls back to a one-line note
          # if the section can't be located so the release still publishes.
          node > release-notes.md <<'EOF'
          const fs = require('node:fs');
          const tag = process.env.TAG;
          const src = fs.readFileSync('CHANGELOG.md', 'utf8').split('\n');
          const escTag = tag.replace(/\./g, '\\.');
          const startRe = new RegExp('^##\\s+\\d{4}-\\d{2}-\\d{2}\\s+\\(' + escTag + '\\)\\s*$');
          let start = -1;
          for (let i = 0; i < src.length; i++) {
            if (startRe.test(src[i])) { start = i + 1; break; }
          }
          if (start === -1) {
            console.log(`Wisp ${tag}\n`);
            process.exit(0);
          }
          let end = src.length;
          for (let j = start; j < src.length; j++) {
            if (/^##\s+/.test(src[j])) { end = j; break; }
          }
          const body = src.slice(start, end).join('\n').trim();
          console.log(body || `Wisp ${tag}`);
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ARGS=(
            "${{ steps.ver.outputs.tag }}"
            --title "${{ steps.ver.outputs.tag }}"
            --notes-file release-notes.md
            "${{ steps.pack.outputs.archive }}"
            "${{ steps.pack.outputs.sha256 }}"
          )
          if [[ "${{ steps.ver.outputs.prerelease }}" == "true" ]]; then
            ARGS+=( --prerelease )
          fi
          gh release create "${ARGS[@]}"
