<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wisp workload pages: mockup</title>
<style>
:root{
  --surface:#f6faf9;--sidebar:#edf4f2;--card:#fff;--border:#dce8e5;--input:#fff;
  --accent:#0fa396;--accent-hover:#0b8578;--accent-soft:#dff3f0;--accent-text:#0a7568;
  --run:#21813f;--warn:#9c6203;--stop:#c93a3a;--run-soft:#e2f4e6;--warn-soft:#faf0d7;--stop-soft:#fbe5e5;
  --t1:#0e1f1c;--t2:#3a524d;--t3:#56716b;
  --shadow:0 1px 3px rgba(0,0,0,.08);--pop:0 10px 15px -3px rgb(0 0 0/.1),0 4px 6px -4px rgb(0 0 0/.1);
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace;
}
:root[data-theme=dark]{
  --surface:#0e1c1a;--sidebar:#0a1715;--card:#142523;--border:#28453f;--input:#0b1a18;
  --accent-hover:#14b5a7;--accent-soft:#0f342f;--accent-text:#4fd1c0;
  --run:#45c97a;--warn:#e0a63a;--stop:#f2706b;--run-soft:#183b2b;--warn-soft:#343520;--stop-soft:#372b29;
  --t1:#e8f2ef;--t2:#b3c6c2;--t3:#7e9994;
  --shadow:0 1px 3px rgba(0,0,0,.6);--pop:0 12px 28px -6px rgb(0 0 0/.7),0 4px 10px -4px rgb(0 0 0/.55);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 var(--sans);color:var(--t1);background:#cfdad7;display:flex;flex-direction:column}
:root[data-theme=dark] body{background:#050b0a}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---- the mockup's own controls (not part of Wisp) ---- */
.bar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:8px 14px;background:#12211f;color:#cfe3de;font-size:12.5px}
.bar b{font-weight:600;color:#fff;margin-right:2px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid #2f4d47;border-radius:7px;overflow:hidden}
.seg button{background:none;border:0;padding:4px 10px;color:#a9c4be}
.seg button[aria-pressed=true]{background:#0fa396;color:#fff}
.bar .note{margin-left:auto;color:#8fb0a9}

/* ---- stage ---- */
.stage{flex:1;min-height:0;display:flex;justify-content:center;padding:14px}
.app{flex:1;max-width:1320px;min-height:0;display:grid;grid-template:44px minmax(0,1fr)/232px minmax(0,1fr);background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;position:relative}
.phone .app{max-width:392px;grid-template:44px minmax(0,1fr)/minmax(0,1fr);border-radius:28px}
.top{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--card);border-bottom:1px solid var(--border)}
.top .logo{font-weight:700;letter-spacing:-.01em;font-size:15px}
.top .host{color:var(--t3)}
.side{background:var(--sidebar);border-right:1px solid var(--border);padding:12px 8px;overflow:auto}
.phone .side{display:none}
.side h4{margin:4px 8px 8px;font-size:12px;font-weight:600;color:var(--t3)}
.wl{display:flex;gap:9px;align-items:center;padding:7px 8px;border-radius:7px;color:var(--t2)}
.wl small{display:block;color:var(--t3);font-size:11.5px}
.wl.on{background:var(--card);box-shadow:var(--shadow);color:var(--t1)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--t3);flex:none}
.dot.run{background:var(--run)}
.main{min-width:0;overflow:auto;position:relative}

/* ---- page header ---- */
.head{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--border);padding:12px 20px 0}
.phone .head{padding:10px 14px 0}
.h1{display:flex;align-items:center;gap:10px}
.h1 h1{font-size:19px;margin:0;font-weight:650;letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.state{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:550;padding:2px 9px;border-radius:99px;background:var(--run-soft);color:var(--run);white-space:nowrap}
.state.off{background:var(--sidebar);color:var(--t3)}
.kind{color:var(--t3);font-size:12.5px;white-space:nowrap}
.phone .kind{display:none}
.acts{margin-left:auto;display:flex;gap:6px;position:relative}
.ib{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:1px solid var(--border);background:var(--card);border-radius:7px;color:var(--t2);flex:none}
.ib:hover{background:var(--surface);color:var(--t1)}
.ib.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.ib.pri:hover{background:var(--accent-hover)}
.ib.q{border-color:transparent;background:none;width:30px;height:30px;color:var(--t3)}
.ib.q:hover{background:var(--accent-soft);color:var(--accent-text)}
.ib.q.del:hover{background:var(--stop-soft);color:var(--stop)}
.ib[disabled]{opacity:.38;cursor:not-allowed}
.ib .two{display:inline-flex;align-items:center}
.ib .two svg:first-child{width:11px;height:11px;margin-right:1px}
.btn{border:1px solid var(--border);background:var(--card);border-radius:7px;padding:5px 12px;font-weight:550;font-size:13px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.menu{position:absolute;right:0;top:38px;background:var(--card);border:1px solid var(--border);border-radius:9px;box-shadow:var(--pop);padding:5px;min-width:180px;display:none;z-index:20}
.menu.open{display:block}
.menu button{display:flex;gap:9px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px}
.menu button:hover{background:var(--surface)}
.menu hr{border:0;border-top:1px solid var(--border);margin:4px 0}
.tabs{display:flex;gap:18px;margin-top:10px}
.tabs span{padding:7px 1px 9px;color:var(--t3);border-bottom:2px solid transparent;font-weight:550}
.tabs span.on{color:var(--accent-text);border-color:var(--accent)}

/* ---- figures at the top: fixed cells, so a changing number moves nothing ---- */
.wrap{max-width:860px;margin:0 auto;padding:18px 20px 60px}
.phone .wrap{padding:14px 12px 50px}
.glance{display:flex;margin:0 0 16px;padding:0 2px}
.glance .g{display:grid;grid-auto-flow:column;grid-auto-columns:148px}
.glance dt{font-size:12px;color:var(--t3)}
.glance dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.glance dd.addr{font-family:var(--mono);font-size:13.5px}
.meter{display:inline-block;width:46px;height:5px;border-radius:9px;background:var(--border);vertical-align:middle;margin-left:7px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.phone .glance{flex-direction:column;gap:12px;padding:0}
.phone .glance .g{grid-auto-columns:minmax(0,1fr);text-align:center}

/* ---- cards ---- */
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);margin-bottom:12px}
.card>header{display:flex;align-items:center;gap:6px;padding:9px 12px 0 16px;min-height:42px}
.card h2{font-size:14.5px;margin:0 auto 0 0;font-weight:650;display:flex;align-items:center;gap:8px}
.card h2 svg{width:13px;height:13px;color:var(--t3)}
.body{padding:6px 16px 12px}
.rows{display:grid;grid-template-columns:132px 1fr;gap:5px 14px;margin:0}
.phone .rows{grid-template-columns:104px 1fr}
.rows dt{color:var(--t3)}
.rows dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mono{font-family:var(--mono);font-size:13px}
.item{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--border)}
.item:first-child{border-top:0}
.item .what{flex:1;min-width:0}
.item .what b{font-weight:600}
.item .what small{display:block;color:var(--t3);font-size:12.5px;overflow-wrap:anywhere}
.item .do{display:flex;gap:0;flex:none;margin-right:-6px}
.empty{color:var(--t3);padding:2px 0}
.sw{display:flex;align-items:center;gap:12px;padding:7px 0;border-top:1px solid var(--border)}
.sw:first-child{border-top:0}
.sw .what{flex:1}
.sw small{display:block;color:var(--t3);font-size:12.5px}
.tog{width:36px;height:21px;border-radius:99px;border:0;background:var(--border);position:relative;flex:none;transition:background .15s}
.tog::after{content:"";position:absolute;left:2px;top:2px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.tog[aria-checked=true]{background:var(--accent)}
.tog[aria-checked=true]::after{transform:translateX(15px)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--warn-soft);color:var(--warn);margin-right:6px}
.badge.ok{background:var(--accent-soft);color:var(--accent-text)}
.flash{animation:flash 1.1s ease-out}
@keyframes flash{from{box-shadow:0 0 0 3px var(--accent-soft)}to{box-shadow:var(--shadow)}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}.tog,.tog::after{transition:none}}

/* ---- editor ---- */
.veil{position:absolute;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.veil.open{display:flex}
.phone .veil{align-items:flex-end;padding:0}
.ed{background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--pop);width:100%;max-width:440px;max-height:88%;display:flex;flex-direction:column}
.phone .ed{max-width:none;border-radius:16px 16px 0 0;border-bottom:0}
.ed header{padding:14px 18px 2px}
.ed h3{margin:0;font-size:16px;font-weight:650}
.ed header p{margin:2px 0 0;color:var(--t3);font-size:12.5px}
.ed form{padding:8px 18px 4px;overflow:auto}
.ed fieldset{border:0;padding:0;margin:0 0 6px}
.ed legend{font-weight:650;font-size:13px;padding:8px 0 2px}
.f{margin:9px 0}
.f label{display:block;font-weight:550;font-size:13px;margin-bottom:3px}
.f small{display:block;color:var(--t3);font-size:12px;margin-top:3px}
.f input,.f select{width:100%;font:inherit;color:var(--t1);background:var(--input);border:1px solid var(--border);border-radius:7px;padding:6px 9px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--border);background:var(--card);border-radius:7px;padding:6px 11px;text-align:left}
.pick button small{margin:0}
.pick button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
.ed footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--border)}
.create{max-width:540px}
.create h1{font-size:19px;margin:4px 0 12px;letter-spacing:-.015em}
</style>
</head>
<body>

<div class="bar" id="bar"></div>
<div class="stage" id="stage">
  <div class="app">
    <div class="top"><span class="logo">Wisp</span><span class="host">tini</span></div>
    <nav class="side" id="side"></nav>
    <main class="main" id="main"></main>
    <div class="veil" id="veil"></div>
  </div>
</div>

    cards:[
      {id:'keys', title:'SSH keys', acts:[['github','Import from GitHub','gh'],['plus','Add key','key']],
       items:[{b:'alex@laptop <span class="badge ok" style="margin-left:6px">Default</span>', s:'ed25519, SHA256:9f3c…a71e', act:[['star','Default for new VMs'],['trash','Remove']]},
              {b:'alex@phone', s:'ed25519, SHA256:41bd…0c2f', act:[['star','Default for new VMs'],['trash','Remove']]},
              {b:'work-yubikey', s:'ecdsa-sk, SHA256:c0de…77aa', act:[['star','Default for new VMs'],['trash','Remove']]}],
       forms:{key:{title:'Add key', fields:[{l:'Public key', v:'', ph:'ssh-ed25519 AAAA… name'},{l:'Name', v:'', ph:'From the key, or key-4'},{l:'Default for new VMs', tog:false}]},
              gh:{title:'Import from GitHub', fields:[{l:'GitHub user', v:'', ph:'alex'},{l:'Default for new VMs', tog:false}]}}},
    ]}
};
PAGES.win = JSON.parse(JSON.stringify(PAGES.vm));
Object.assign(PAGES.win, { name:'hawty', kind:'Windows 11 VM',
  glance:[['Address','192.168.1.171','addr'],['Uptime','2 d'],['CPU','11%',11],['Memory','5.2 / 8 GB',65]] });
PAGES.win.cards = PAGES.win.cards.filter((c) => !c.linux);
PAGES.win.cards[0].rows = [['CPU','4 cores'],['Memory','8 GB']];
PAGES.win.cards[1].items = [{b:'Disk 1', s:'120 GB, hawty.qcow2', act:[['edit','Resize','disk',true]]},{b:'CD', s:'virtio-win-0.1.285.iso', act:[['disc','Change ISO','iso'],['eject','Eject']]}];
PAGES.win.cards[2].items = [{b:'Adapter 1', s:'br0, 192.168.1.171', act:[['edit','Edit adapter','nic',true]]}];
PAGES.win.cards.find((c) => c.id==='sys').profile = ['Windows 11','UEFI Secure Boot, TPM 2.0, Hyper-V tuning, VirtIO with driver CD'];
PAGES.win.cards.find((c) => c.id==='sys').form.sub = 'Set by the Windows 11 profile.';
PAGES.plain = JSON.parse(JSON.stringify(PAGES.ct));
Object.assign(PAGES.plain, { name:'ubu', glance:[['Address','192.168.1.112','addr'],['Local name','ubu.local','addr'],['Uptime','4 min'],['CPU','0.0%',0],['Memory','2 MB',1]] });
PAGES.plain.cards = PAGES.plain.cards.filter((c) => c.id!=='app');
{ const c = (id) => PAGES.plain.cards.find((x) => x.id===id);
  c('img').rows = [['Image','docker.io/library/ubuntu:latest','mono'],['Updates','Up to date']]; c('img').acts = [['edit','Change image','main',true]];
  delete c('env').items; c('env').empty = 'No variables.';
  delete c('mnt').items; c('mnt').empty = 'Nothing is kept outside the container.';
  c('net').sw = [['Announce as ubu.local','',true]]; c('net').rows = [['Bridge','br0'],['MAC address','02:42:ac:11:00:70','mono']];
  c('adv').rows = [['Command','sleep infinity'],['User','root'],['Devices','None']]; }

const SIDE = [['archy','Linux VM','vm',true],['hawty','Windows 11 VM','win',true],['webby','caddy:latest','ct',true],['ubu','ubuntu:latest','plain',true],['samba','tiny-samba','',false]];

/* ---------- render ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

function bar() {
  const seg = (label, key, opts) => `<span><b>${label}</b> <span class="seg">${opts.map(([v,t]) =>
    `<button aria-pressed="${S[key]===v}" data-k="${key}" data-v="${v}">${t}</button>`).join('')}</span></span>`;
  $('#bar').innerHTML =
    seg('Page','page',[['vm','Linux VM'],['win','Windows VM'],['ct','App container'],['plain','Plain container'],['new','New VM'],['keys','SSH keys']]) +
    seg('It is','running',[[true,'Running'],[false,'Stopped']]) +
    seg('Screen','phone',[[false,'Desktop'],[true,'Phone']]) +
    seg('Theme','theme',[['light','Light'],['dark','Dark']]) +
    `<span class="note">Mockup controls, not part of Wisp</span>`;
}
$('#bar').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-k]'); if (!b) return;
  let v = b.dataset.v; if (v==='true') v = true; if (v==='false') v = false;
  S[b.dataset.k] = v; draw();
});

/* An icon button: [icon, label, form, needsStop]. Disabled while the workload runs when it needs it stopped. */
function ib([icon, label, form, stop], c, p, cls) {
  const locked = stop && S.running && !p.settings;
  const glyph = icon[0]==='+' ? ic2(icon.slice(1)) : ic(icon);
  const tip = locked ? `${label}: stop the ${p.noun} first` : label;
  return `<button class="ib ${cls}${icon==='trash'?' del':''}" ${locked?'disabled':''} title="${esc(tip)}" aria-label="${esc(tip)}" data-card="${c.id}" data-form="${form||''}" data-label="${esc(label)}">${glyph}</button>`;
}

function card(c, p) {
  const anyLocked = S.running && !p.settings && [...(c.acts||[]), ...(c.items||[]).flatMap((i) => i.act)].some((a) => a[3]);
  let body = '';
  if (c.profile) body += `<p style="margin:2px 0 2px"><span class="badge ok">${c.profile[0]}</span>${c.profile[1]}</p>`;
  if (c.sw) body += c.sw.map(([t,s,on]) => `<div class="sw"><div class="what">${t}${s?`<small>${s}</small>`:''}</div><button class="tog" role="switch" aria-checked="${on}" aria-label="${esc(t)}"></button></div>`).join('');
  if (c.rows) body += `<dl class="rows"${c.sw?' style="border-top:1px solid var(--border);padding-top:9px;margin-top:2px"':''}>${c.rows.map(([k,v,cls]) => `<dt>${k}</dt><dd class="${cls||''}">${v}</dd>`).join('')}</dl>`;
  if (c.items) body += c.items.map((it) => `<div class="item"><div class="what"><b>${it.b}</b><small>${it.s}</small></div><div class="do">${it.act.map((a) => ib(a,c,p,'q')).join('')}</div></div>`).join('');
  if (c.empty) body += `<div class="empty">${c.empty}</div>`;
  return `<section class="card" id="c-${c.id}"><header><h2>${c.title}${anyLocked?`<span title="Stop the ${p.noun} to change this">${ic('lock')}</span>`:''}</h2>${(c.acts||[]).map((a) => ib(a,c,p,'q')).join('')}</header><div class="body">${body}</div></section>`;
}

function glance(p) {
  if (!S.running) return `<dl class="glance"><div class="g"><div><dt>Stopped</dt><dd>2 hours ago</dd></div></div></dl>`;
  const cell = ([k,v,x]) => `<div><dt>${k}</dt><dd class="${x==='addr'?'addr':''}">${v}${typeof x==='number'?`<span class="meter"><i style="width:${x}%"></i></span>`:''}</dd></div>`;
  const facts = p.glance.filter((g) => typeof g[2]!=='number'), meters = p.glance.filter((g) => typeof g[2]==='number');
  return `<dl class="glance"><div class="g">${facts.map(cell).join('')}</div><div class="g">${meters.map(cell).join('')}</div></dl>`;
}

function page(p) {
  if (p.settings) return `
    <div class="head"><div class="h1"><h1>${p.name}</h1></div>
      <div class="tabs">${p.tabs.map((t,i) => `<span class="${i===p.tab?'on':''}">${t}</span>`).join('')}</div></div>
    <div class="wrap">${p.cards.map((c) => card(c,p)).join('')}</div>`;
  const run = S.running;
  const hb = (icon, label, cls='') => `<button class="ib ${cls}" title="${label}" aria-label="${label}">${ic(icon)}</button>`;
  const acts = run ? hb('stop','Stop') + hb('restart','Restart') : hb('play','Start','pri');
  const mi = (icon, label, danger) => `<button${danger?' style="color:var(--stop)"':''}>${ic(icon)}${label}</button>`;
  return `
  <div class="head">
    <div class="h1"><h1>${p.name}</h1><span class="state ${run?'':'off'}"><span class="dot ${run?'run':''}"></span>${run?'Running':'Stopped'}</span><span class="kind">${p.kind}</span>
      <div class="acts">${acts}<button class="ib" id="more" title="More" aria-label="More" aria-haspopup="menu">${ic('more')}</button>
        <div class="menu" id="menu" role="menu">
          ${run?mi('pause','Pause')+mi('zap','Force stop')+'<hr>':''}
          ${mi('edit','Rename')}${mi('star','Change icon')}${mi('backup','Back up now')}
          <hr>${mi('trash','Delete',true)}
        </div></div></div>
    <div class="tabs">${p.tabs.map((t,i) => `<span class="${i?'':'on'}">${t}</span>`).join('')}</div>
  </div>
  <div class="wrap">${glance(p)}${p.cards.map((c) => card(c,p)).join('')}</div>`;
}

function field(f, i) {
  const id = 'f'+i;
  if (f.pick) return `<div class="f"><label>${f.l}</label><div class="pick"${f.multi?' data-multi="1"':''}>${f.pick.map(([t,s],j) => `<button type="button" aria-pressed="${f.multi ? f.on.includes(j) : j===f.v}">${t}${s?`<small>${s}</small>`:''}</button>`).join('')}</div></div>`;
  if (f.tog !== undefined) return `<div class="sw" style="border:0;padding:6px 0"><div class="what"><b style="font-weight:550;font-size:13px">${f.l}</b></div><button type="button" class="tog" role="switch" aria-checked="${f.tog}" aria-label="${esc(f.l)}"></button></div>`;
  const ctl = f.sel ? `<select id="${id}">${f.sel.map((o) => `<option>${o}</option>`).join('')}</select>`
                    : `<input id="${id}" type="${f.t||'text'}" value="${esc(f.v||'')}" placeholder="${esc(f.ph||'')}">`;
  return `<div class="f"><label for="${id}">${f.l}</label>${ctl}${f.h?`<small>${f.h}</small>`:''}</div>`;
}

function pickClick(t) {
  if (t.parentNode.dataset.multi) t.setAttribute('aria-pressed', t.getAttribute('aria-pressed')!=='true');
  else t.parentNode.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b===t));
}

function openEditor(form, cardId, label) {
  let n = 0;
  const fields = form.groups
    ? form.groups.map(([g, fs]) => `<fieldset><legend>${g}</legend>${fs.map((f) => field(f, n++)).join('')}</fieldset>`).join('')
    : form.fields.map((f) => field(f, n++)).join('');
  const veil = $('#veil');
  const add = /^(Add|Attach|Insert|Import)/.test(label||'');
  veil.innerHTML = `<div class="ed" role="dialog" aria-modal="true" aria-label="${esc(form.title)}">
    <header><h3>${form.title}</h3>${form.sub?`<p>${form.sub}</p>`:''}</header>
    <form>${fields}</form>
    <footer><button class="btn" data-x="cancel">Cancel</button><button class="btn pri" data-x="save">${add ? label.split(' ')[0] : 'Save'}</button></footer></div>`;
  veil.classList.add('open');
  veil.onclick = (e) => {
    const tog = e.target.closest('.tog'); if (tog) tog.setAttribute('aria-checked', tog.getAttribute('aria-checked')!=='true');
    const pk = e.target.closest('.pick button'); if (pk) pickClick(pk);
    const x = e.target.closest('[data-x]'); if (!x) return;
    e.preventDefault(); veil.classList.remove('open');
    if (x.dataset.x==='save') { const c = $('#c-'+cardId); if (c) { c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash'); } }
  };
  const first = $('input,select', veil); if (first && !S.phone) first.focus();
}

function createPage() {
  const tiles = [['Linux image','Ready in a minute'],['Linux installer','Install from an ISO'],['Windows 11','Secure Boot and TPM set'],['Other','Plain defaults']];
  const pick = (opts, on, style='') => `<div class="pick">${opts.map(([t,s],j) => `<button type="button" aria-pressed="${j===on}"${style}>${t}${s?`<small>${s}</small>`:''}</button>`).join('')}</div>`;
  return `<div class="wrap create"><h1>New VM</h1>
    <section class="card"><div class="body" style="padding-top:12px">
      <div class="f"><label for="n1">Name</label><input id="n1" placeholder="media"></div>
      <div class="f"><label>Runs</label>${pick(tiles, 0, ' style="flex:1 1 200px"')}</div>
      <div class="f"><label for="n2">Image</label><select id="n2"><option>ubuntu-26.04-server-cloudimg-amd64.img</option><option>Download another…</option></select></div>
      <div class="f"><label>Size</label>${pick([['Small','2 cores, 2 GB'],['Medium','2 cores, 4 GB'],['Large','4 cores, 8 GB'],['Custom','']], 1)}</div>
      <div class="f"><label for="n3">Disk (GB)</label><input id="n3" type="number" value="40"></div>
      <div class="f"><label for="n4">User</label><input id="n4" value="alex"></div>
      <div class="f"><label>SSH keys</label><div class="pick" data-multi="1"><button type="button" aria-pressed="true">alex@laptop</button><button type="button" aria-pressed="false">alex@phone</button><button type="button" aria-pressed="false">work-yubikey</button></div></div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn">Cancel</button><button class="btn pri">Create</button></div>
    </div></section></div>`;
}

function draw() {
  document.documentElement.dataset.theme = S.theme;
  $('#stage').classList.toggle('phone', S.phone);
  bar();
  $('#side').innerHTML = `<h4>Workloads</h4>` + SIDE.map(([n,s,k,run]) =>
    `<div class="wl ${k && k===S.page?'on':''}"><span class="dot ${run && (k!==S.page || S.running)?'run':''}"></span><span>${n}<small>${s}</small></span></div>`).join('');
  $('#veil').classList.remove('open');
  const m = $('#main');
  m.innerHTML = S.page==='new' ? createPage() : page(PAGES[S.page]);
  m.scrollTop = 0;
}

$('#main').addEventListener('click', (e) => {
  const menu = $('#menu');
  if (e.target.closest('#more')) { menu.classList.toggle('open'); return; }
  if (menu) menu.classList.remove('open');
  const tog = e.target.closest('.tog'); if (tog) { tog.setAttribute('aria-checked', tog.getAttribute('aria-checked')!=='true'); return; }
  const pk = e.target.closest('.pick button'); if (pk) { pickClick(pk); return; }
  const b = e.target.closest('button[data-card]'); if (!b || b.disabled || !b.dataset.form) return;
  const c = PAGES[S.page].cards.find((x) => x.id===b.dataset.card);
  const form = b.dataset.form==='main' ? c.form : c.forms && c.forms[b.dataset.form];
  if (form) openEditor(form, c.id, b.dataset.label);
});
document.addEventListener('keydown', (e) => { if (e.key==='Escape') { $('#veil').classList.remove('open'); const m=$('#menu'); if (m) m.classList.remove('open'); } });
draw();
</script>
</body>
